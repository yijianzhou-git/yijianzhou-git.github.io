<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量文件重命名工具 - 一键批量重命名</title>
    <meta name="description" content="专业的在线批量文件重命名工具，支持多种命名规则，实时预览，一键操作">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📁</span>
                <h1>批量文件重命名</h1>
            </div>
            <div class="price-badge">¥0.5/次</div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 文件上传区域 -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <p>拖拽文件到这里，或点击选择文件</p>
                    <input type="file" id="fileInput" multiple accept="*/*" />
                    <button class="browse-btn" onclick="document.getElementById('fileInput').click()">浏览文件</button>
                </div>
                <div class="file-list" id="fileList">
                    <!-- 上传的文件列表 -->
                </div>
            </section>

            <!-- 重命名规则设置 -->
            <section class="rules-section">
                <h2>重命名规则</h2>
                
                <div class="rule-group">
                    <label class="rule-label">
                        <input type="text" id="prefix" placeholder="添加前缀（如：vacation_）" />
                        <span class="rule-desc">前缀</span>
                    </label>
                    
                    <label class="rule-label">
                        <input type="text" id="suffix" placeholder="添加后缀（如：_2024）" />
                        <span class="rule-desc">后缀</span>
                    </label>
                </div>

                <div class="rule-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="addNumber" />
                        <span>添加数字序号</span>
                    </label>
                    <div class="number-padding" id="numberPadding">
                        <label>序号位数：</label>
                        <select id="paddingSelect">
                            <option value="1">1位 (1,2,3...)</option>
                            <option value="2">2位 (01,02,03...)</option>
                            <option value="3" selected>3位 (001,002,003...)</option>
                            <option value="4">4位 (0001,0002...)</option>
                        </select>
                    </div>
                </div>

                <div class="rule-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="addDate" />
                        <span>添加日期</span>
                    </label>
                    <select id="dateFormat" disabled>
                        <option value="YYYYMMDD" selected>YYYYMMDD</option>
                        <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                        <option value="MMDDYYYY">MMDDYYYY</option>
                    </select>
                </div>

                <div class="rule-group">
                    <label class="rule-label">
                        <input type="text" id="replaceOld" placeholder="查找文字" />
                        <span class="rule-desc">替换（查找）</span>
                    </label>
                    <label class="rule-label">
                        <input type="text" id="replaceNew" placeholder="替换为" />
                        <span class="rule-desc">替换为</span>
                    </label>
                </div>
            </section>

            <!-- 预览区域 -->
            <section class="preview-section">
                <h2>预览效果</h2>
                <div class="preview-list" id="previewList">
                    <div class="empty-state">
                        <span class="empty-icon">👆</span>
                        <p>上传文件后预览重命名效果</p>
                    </div>
                </div>
            </section>

            <!-- 操作按钮 -->
            <section class="action-section">
                <button class="action-btn secondary" id="clearBtn">清空文件</button>
                <button class="action-btn primary" id="renameBtn">立即重命名 ¥0.5</button>
            </section>
        </main>

        <!-- 纯净特性宣传 -->
        <section class="pure-section">
            <h2>✨ 纯净工具，即用即走</h2>
            <div class="pure-features">
                <div class="pure-item">
                    <span class="pure-icon">🔒</span>
                    <span class="pure-text">隐私保护：文件本地处理，不上传服务器</span>
                </div>
                <div class="pure-item">
                    <span class="pure-icon">🚫</span>
                    <span class="pure-text">无需注册：打开就用，不留痕迹</span>
                </div>
                <div class="pure-item">
                    <span class="pure-icon">📥</span>
                    <span class="pure-text">无需下载：纯网页工具，用完即走</span>
                </div>
                <div class="pure-item">
                    <span class="pure-icon">✅</span>
                    <span class="pure-text">无后门：干净透明，放心使用</span>
                </div>
            </div>
        </section>

        <!-- 底部 -->
        <footer class="footer">
            <p>💰 每次使用仅需 ¥0.5，安全可靠</p>
            <p>💡 支持实时预览，放心操作</p>
        </footer>
    </div>

    <!-- 支付弹窗 -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>确认支付</h3>
                <button class="close-btn" onclick="closePaymentModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="payment-info">
                    <p>本次操作：批量重命名 <span id="fileCount">0</span> 个文件</p>
                    <p class="price">应付金额：<span class="amount">¥0.5</span></p>
                </div>
                <div class="payment-methods">
                    <button class="payment-btn wechat" onclick="processPayment('wechat')">
                        <span class="payment-icon">💬</span>
                        <span>微信支付</span>
                    </button>
                    <button class="payment-btn alipay" onclick="processPayment('alipay')">
                        <span class="payment-icon">🔷</span>
                        <span>支付宝</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 成功弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content success">
            <div class="success-icon">✅</div>
            <h3>重命名成功！</h3>
            <p>已成功重命名 <span id="successCount">0</span> 个文件</p>
            <button class="download-btn" id="downloadBtn">下载重命名后的文件</button>
            <p class="small-text">文件将以ZIP格式下载</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
